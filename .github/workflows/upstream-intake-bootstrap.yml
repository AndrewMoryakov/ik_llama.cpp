name: One-shot upstream intake

on:
  push:
    branches:
      - intake/upstream-2026-11-06

permissions:
  contents: write
  pull-requests: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Port assessed upstream commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ikawrakow/ik_llama.cpp.git
          git fetch upstream 0d5aaa826b24014dcd67fbdef6055410db7d8079
          git cherry-pick \
            6e390bde13db42b54f5e8eab101b729f7eb75d8e \
            719d709a65e5de4542a47d6adfa0b17cf0bc279f \
            0d5aaa826b24014dcd67fbdef6055410db7d8079
      - name: Configure CPU build
        run: cmake -S . -B build -G Ninja -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
      - name: Build changed runtime paths
        run: cmake --build build --target llama-cli -j 2
      - name: Remove bootstrap workflow and publish branch
        run: |
          git rm .github/workflows/upstream-intake-bootstrap.yml
          git commit -m "chore: remove one-shot intake bootstrap"
          git push origin HEAD:intake/upstream-2026-11-06
      - name: Open adaptive intake PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head intake/upstream-2026-11-06 \
            --title "intake: port upstream through 0d5aaa826b24" \
            --body $'Ports three upstream commits after baseline 656036d98503e154952f6c633cb3febc1a4f08b4.\n\n- 6e390bde: DeepSeek V4.1 raw-K generation — applied unchanged; this fork has no post-baseline edits in llama-dsv4.cpp.\n- 719d709a: transposed comb support — applied unchanged; affects generic GGML/CUDA and Xing4 paths, outside fork-specific runtime code.\n- 0d5aaa82: Ripple/Ricursive model support — applied unchanged after clean composition with the fork\x27s RTR/mmap telemetry changes in llama-model.h and llama.cpp.\n\nVerification: clean cherry-pick, git diff --check, and a CPU CMake build of llama-cli. CUDA-specific compilation remains for the repository CI matrix.'
